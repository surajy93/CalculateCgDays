<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Attendance Calculator</h1>
        <label for="monthYear">Select Month and Year:</label>
        <input type="month" id="monthYear">
        
        <label for="leaveDays">Number of Leave Days:</label>
        <input type="number" id="leaveDays" placeholder="Enter leave days">
        
        <label for="attendancePercentage">Attendance Percentage:</label>
        <input type="number" id="attendancePercentage" placeholder="Enter percentage" value="60" min="0" max="100">
        
        <button onclick="calculateAttendance()">Calculate</button>
        
        <p id="result"></p>
    </div>
    <script src="script.js"></script>
</body>
</html>
